[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "amigo-rag"
version = "0.1.0"
description = "AMIGO 인수인계 시스템 - 문서 파싱 · 청킹 · ChromaDB 기반 검색(RAG) 모듈"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "chromadb>=1.0",
    "numpy>=1.26",
    "pdfplumber>=0.11",
    "pypdfium2>=4.30",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "olefile>=0.46",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# 의미 기반 임베딩(한국어 지원 모델)을 쓰고 싶을 때: AMIGO_RAG_EMBEDDING=st:jhgan/ko-sroberta-multitask
st = ["sentence-transformers>=3.0"]
# Outlook .msg 메일 파일 지원
msg = ["extract-msg>=0.48"]
dev = ["pytest>=8.0", "reportlab>=4.0"]

[project.scripts]
amigo-rag = "amigo_rag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/amigo_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
